name: Lint clang-format

on:
- push
- pull_request

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Run clang-format lint
      uses: DoozyX/clang-format-lint-action@v0.20
      with:
        source: 'include tests'
        extensions: 'hpp,cpp'
        exclude: './.git'
        clangFormatVersion: 19
